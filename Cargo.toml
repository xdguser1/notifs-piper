[package]
name = "notifs-piper"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = { version = "1.0", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
syn = "3.0.3"
tokio = { version = "1.53", features = ["net", "rt", "rt-multi-thread"] }
zbus = { version = "5.18", features = ["tokio"] }
